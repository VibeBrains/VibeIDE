name: Disposable / Timer Audit (W.16)

on:
  pull_request:
    branches:
      - main
      - 'release/*'
    paths:
      - 'src/vs/workbench/contrib/vibeide/**'
      - 'scripts/vibe-disposable-audit.mjs'
      - '.github/workflows/disposable-audit.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: setInterval / setTimeout leak audit
    runs-on: ubuntu-22.04
    # Soft gate — surfaces findings in PR checks without blocking merge.
    # Promote to hard gate once existing findings are triaged.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc

      - name: Run audit
        run: node scripts/vibe-disposable-audit.mjs
