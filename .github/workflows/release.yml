# Публичный репозиторий: минуты Actions не расходуются из бесплатного лимита.
# Триггер: тег vX.Y.Z (рекомендуется) или ручной workflow_dispatch (собирается текущий ref ветки, имя релиза — из поля tag).

name: Release Build

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: read

env:
  # При push тега — ref_name = тег; при ручном запуске — введённый tag (не подменяет checkout ref).
  VIBE_VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Compile TypeScript (shared artifact for all platforms)
  # ─────────────────────────────────────────────────────────────────
  compile:
    name: Compile TypeScript
    # Self-hosted Windows runner handles compile (avoids GitHub-hosted RAM/CPU limits).
    # Fallback: set USE_GITHUB_RUNNER=true in repo variables to use ubuntu-latest instead.
    runs-on: ${{ vars.USE_GITHUB_RUNNER == 'true' && 'ubuntu-latest' || fromJSON('["self-hosted", "windows", "x64"]') }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      # Linux prerequisites only when running on GitHub-hosted ubuntu runner
      - name: Install Linux native build prerequisites
        if: vars.USE_GITHUB_RUNNER == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libkrb5-dev libx11-dev libxkbfile-dev

      - name: Install dependencies
        run: npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      # Self-hosted (default): full pipeline with identifier mangling.
      # GitHub-hosted ubuntu-latest (vars.USE_GITHUB_RUNNER='true'): the mangler worker peaks
      # past the runner's RAM and the process gets Killed (run 40461427681) — use the same
      # without-mangling task as release-macos.sh on low-RAM machines. esbuild minification
      # still runs; only identifier shortening is skipped.
      - name: Compile TypeScript (with mangling, self-hosted)
        if: vars.USE_GITHUB_RUNNER != 'true'
        run: npm run compile-build
        timeout-minutes: 90

      # react/out bundles are gitignored and neither compile-build task builds them (unlike
      # `compile`/`core-ci`, which run build-vibeide-browser-react first). GitHub-hosted runners
      # are clean machines — build React explicitly, same as release-macos.sh does. The
      # self-hosted runner keeps its own tree; do not touch that path.
      - name: Build React bundles (GitHub-hosted only)
        if: vars.USE_GITHUB_RUNNER == 'true'
        run: npm run buildreact
        timeout-minutes: 15

      - name: Compile TypeScript (without mangling, GitHub-hosted)
        if: vars.USE_GITHUB_RUNNER == 'true'
        run: npm run gulp compile-build-without-mangling
        timeout-minutes: 90

      - name: Compile extensions
        run: npm run compile-extensions-build
        timeout-minutes: 45

      - name: Upload compiled output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compiled-output
          path: |
            out/
            extensions/*/out/
            src/vs/workbench/contrib/vibeide/browser/react/out/
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────
  # Windows — .exe installer (InnoSetup) + .zip portable
  # ─────────────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows (${{ matrix.arch }})
    runs-on: windows-latest
    needs: compile
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc

      - name: Download compiled output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: compiled-output

      - name: Install dependencies
        run: npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          npm_config_foreground_scripts: 'true'

      - name: Install InnoSetup
        run: choco install innosetup -y
        shell: powershell

      # patchWin32DependenciesTask calls signtool.exe from PATH. Locate the x64 signtool in
      # the Windows SDK (same glob as scripts/sign-windows.ps1) and expose its directory,
      # so the pinned SDK version on the image does not matter. Hard fail if absent.
      - name: Locate Windows SDK signtool
        shell: pwsh
        run: |
          $candidates = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending
          if (-not $candidates) {
            Write-Error 'signtool.exe not found under C:\Program Files (x86)\Windows Kits\10\bin\*\x64'
            exit 1
          }
          $signtool = $candidates[0]
          Write-Host "signtool: $($signtool.FullName)"
          Add-Content -Path $env:GITHUB_PATH -Value $signtool.DirectoryName

      - name: Build Windows app
        run: node node_modules/gulp/bin/gulp.js vscode-win32-${{ matrix.arch }}
        timeout-minutes: 45

      # inno-updater task stages tools/inno_updater.exe + vcruntime140.dll into the app
      # folder; code.iss references tools/*, so it must run before the installer build.
      - name: Build Windows inno-updater
        run: node node_modules/gulp/bin/gulp.js vscode-win32-${{ matrix.arch }}-inno-updater
        timeout-minutes: 5

      - name: Build Windows installer (.exe)
        run: node node_modules/gulp/bin/gulp.js vscode-win32-${{ matrix.arch }}-system-setup
        timeout-minutes: 20

      - name: Name Windows ARM64 installer
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: Move-Item -Force ".build/win32-arm64/system-setup/VibeIDESetup.exe" ".build/win32-arm64/system-setup/VibeIDESetup-arm64.exe"

      # No gulp archive task for win32 — pack the folder the build produced
      # (same as scripts/release-windows.ps1: Compress-Archive from ../VibeIDE-win32-<arch>).
      - name: Build Windows portable (.zip)
        shell: pwsh
        run: |
          $appDir = "../VibeIDE-win32-${{ matrix.arch }}"
          if (-not (Test-Path $appDir)) {
            Write-Error "Packaged app folder not found: $appDir"
            exit 1
          }
          $archiveDir = ".build/win32-${{ matrix.arch }}/archive"
          New-Item -ItemType Directory -Force -Path $archiveDir | Out-Null
          # В имени файла версия без ведущей «v», как у локальных скриптов (тег остаётся vX.Y.Z)
          $fileVersion = $env:VIBE_VERSION -replace '^v', ''
          Get-ChildItem "$archiveDir/VibeIDE-*-win32-${{ matrix.arch }}.zip" -ErrorAction SilentlyContinue |
            Remove-Item -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path "$appDir/*" -DestinationPath "$archiveDir/VibeIDE-$fileVersion-win32-${{ matrix.arch }}.zip" -Force
          Get-ChildItem "$archiveDir/VibeIDE-$fileVersion-win32-${{ matrix.arch }}.zip" | Select-Object -ExpandProperty FullName
        timeout-minutes: 10

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-${{ matrix.arch }}
          path: |
            .build/win32-${{ matrix.arch }}/system-setup/VibeIDESetup*.exe
            .build/win32-${{ matrix.arch }}/archive/VibeIDE-*.zip
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────
  # macOS — отдельные .dmg и portable .zip для Apple Silicon и Intel
  # ─────────────────────────────────────────────────────────────────
  build-macos:
    name: Build macOS (${{ matrix.arch }})
    # Each arch builds on its own hardware so native modules match the target
    # (npm/node-gyp install for the host). macos-13 was retired 2025-12-04;
    # macos-15-intel is the current standard-runner Intel label (runner-images README).
    runs-on: ${{ matrix.runner }}
    needs: compile
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-latest
    env:
      # runEsbuildBundle spawns a child node (build/next/index.ts bundle) that inherits
      # NODE_OPTIONS — without a raised heap the bundle step dies on the hosted runner
      # (same ceiling release-macos.sh sets via BUILD_HEAP_MB).
      NODE_OPTIONS: --max-old-space-size=8192

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc

      - name: Download compiled output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: compiled-output

      - name: Install dependencies
        run: npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          npm_config_foreground_scripts: 'true'

      - name: Build macOS app
        run: node node_modules/gulp/bin/gulp.js vscode-darwin-${{ matrix.arch }}
        timeout-minutes: 45

      # Версия в Info.plist, строка про микрофон и подпись — тем же скриптом, что и у release-macos.sh:
      # Без перепаковки подписи собранное gulp приложение на Apple Silicon не запускается
      - name: Guard — one DMG path
        run: node scripts/dmg-single-path.test.mts

      - name: Finish app (version, microphone string, signature)
        run: scripts/finish-macos-app.sh "../VibeIDE-darwin-${{ matrix.arch }}/VibeIDE.app" "${VIBE_VERSION#v}"
        timeout-minutes: 10

      # Образ собирает наш scripts/build-dmg-macos.sh — тот же, что у release-macos.sh: свой фон, раскладка, том «VibeIDE».
      # Апстримовый build/darwin/create-dmg.ts не используется: он даёт фон VS Code и том «VS Code»
      - name: Create .dmg
        run: |
          brew install librsvg
          mkdir -p .build/darwin-${{ matrix.arch }}
          scripts/build-dmg-macos.sh "../VibeIDE-darwin-${{ matrix.arch }}/VibeIDE.app" ".build/darwin-${{ matrix.arch }}/VibeIDE-${VIBE_VERSION#v}-darwin-${{ matrix.arch }}.dmg"
        timeout-minutes: 20

      # ditto сохраняет подпись и расширенные атрибуты в portable ZIP для каждой архитектуры
      - name: Create portable .zip
        run: ditto -c -k --sequesterRsrc --keepParent "../VibeIDE-darwin-${{ matrix.arch }}/VibeIDE.app" ".build/darwin-${{ matrix.arch }}/VibeIDE-${VIBE_VERSION#v}-darwin-${{ matrix.arch }}.zip"
        timeout-minutes: 10

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-${{ matrix.arch }}
          path: |
            .build/darwin-${{ matrix.arch }}/VibeIDE-*.dmg
            .build/darwin-${{ matrix.arch }}/VibeIDE-*.zip

  # ─────────────────────────────────────────────────────────────────
  # Linux — .deb, .rpm, .tar.gz + ARM64
  # ─────────────────────────────────────────────────────────────────
  build-linux:
    name: Build Linux (${{ matrix.arch }})
    # ubuntu-latest now resolves to 26.04, where dpkg-shlibdeps aborts with a
    # Perl Dpkg/Shlibs/SymbolFile.pm error and breaks the .deb build (run 40493134071).
    # Pin to 24.04 until that toolchain bug is resolved.
    # arm64 собирается на родной arm64-машине: при кросс-сборке на x64 линковщику
    # не хватало arm64-версий libX11 и libxkbfile (native-keymap, run 40679735118)
    runs-on: ${{ matrix.runner }}
    needs: compile
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc

      - name: Download compiled output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: compiled-output

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libkrb5-dev libx11-dev libxkbfile-dev rpm fakeroot
          npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          npm_config_foreground_scripts: 'true'

      - name: Build Linux app
        run: node node_modules/gulp/bin/gulp.js vscode-linux-${{ matrix.arch }}
        timeout-minutes: 45

      - name: Prepare .deb package
        run: node node_modules/gulp/bin/gulp.js vscode-linux-${{ matrix.arch }}-prepare-deb
        timeout-minutes: 10

      - name: Build .deb package
        run: node node_modules/gulp/bin/gulp.js vscode-linux-${{ matrix.arch }}-build-deb
        timeout-minutes: 15

      - name: Prepare .rpm package
        run: node node_modules/gulp/bin/gulp.js vscode-linux-${{ matrix.arch }}-prepare-rpm
        timeout-minutes: 10

      - name: Build .rpm package
        run: node node_modules/gulp/bin/gulp.js vscode-linux-${{ matrix.arch }}-build-rpm
        timeout-minutes: 15

      - name: Build .tar.gz (portable)
        run: |
          mkdir -p ".build/linux-${{ matrix.arch }}/archive"
          tar -czf ".build/linux-${{ matrix.arch }}/archive/VibeIDE-${VIBE_VERSION#v}-linux-${{ matrix.arch }}.tar.gz" -C .. "VibeIDE-linux-${{ matrix.arch }}"
        timeout-minutes: 10

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-${{ matrix.arch }}
          path: |
            .build/linux/deb/**/*.deb
            .build/linux/rpm/**/*.rpm
            .build/linux-${{ matrix.arch }}/archive/*.tar.gz
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────
  # Create GitHub Release
  # ─────────────────────────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [compile, build-windows, build-macos, build-linux]
    # Одна упавшая платформа не прячет готовые сборки остальных:
    # шаг идёт, если собрался общий compile, и выкладывает то, что есть
    if: ${{ !cancelled() && needs.compile.result == 'success' }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      # Скрипты .mts запускаются самим node (вырезание типов), версия — из .nvmrc
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-artifacts/
          pattern: '{windows,macos,linux}-*'

      - name: Generate changelog
        run: |
          set -e
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            node scripts/vibe-changelog.js --since "$PREV" > RELEASE_NOTES.md
          else
            node scripts/vibe-changelog.js --first-release "$VIBE_VERSION" > RELEASE_NOTES.md
          fi

      - name: Generate transparency report
        run: node scripts/vibe-transparency-dashboard.js --output transparency.json

      # Один генератор с sbom.yml: зависимости из package-lock.json, пустой список — провал шага
      - name: Generate SBOM
        run: node scripts/vibe-sbom.mts --version "${VIBE_VERSION}" --output sbom.json
        env:
          VIBE_VERSION: ${{ env.VIBE_VERSION }}

      - name: Build release manifest and checksums
        run: |
          node scripts/vibe-release-manifest.mjs \
            --root release-artifacts \
            --tag "${VIBE_VERSION}" \
            --extra sbom.json \
            --extra transparency.json
        env:
          VIBE_VERSION: ${{ env.VIBE_VERSION }}

      # Публикует владелец после ручной проверки (двухфазный выпуск), поэтому CI:
      # - релиза нет — создаёт черновик с авточенджлогом;
      # - релиз есть — только доливает файлы, которых в нём нет: ноты и уже выложенные
      #   (проверенные локальные сборки) не трогает
      - name: Create draft or add missing assets
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          files=(
            release-artifacts/windows-*/**/*.exe release-artifacts/windows-*/**/*.zip
            release-artifacts/macos-*/**/*.dmg release-artifacts/macos-*/**/*.zip
            release-artifacts/linux-*/**/*.deb release-artifacts/linux-*/**/*.rpm release-artifacts/linux-*/**/*.tar.gz
          )
          # Манифест и контрольные суммы считаны по файлам CI: в чужой релиз с локальными
          # сборками они не идут, иначе суммы разойдутся с выложенными файлами
          extras=(sbom.json transparency.json)
          own_extras=(release-manifest.json checksums-sha256.txt)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::Нет ни одного собранного файла"
            exit 1
          fi
          if gh release view "$VIBE_VERSION" >/dev/null 2>&1; then
            existing=$(gh release view "$VIBE_VERSION" --json assets -q '.assets[].name')
            missing=()
            for f in "${files[@]}" "${extras[@]}"; do
              if ! grep -qxF "$(basename "$f")" <<<"$existing"; then
                missing+=("$f")
              fi
            done
            if [ ${#missing[@]} -eq 0 ]; then
              echo "Все файлы уже в релизе $VIBE_VERSION"
            else
              printf 'Доливаю: %s\n' "${missing[@]##*/}"
              gh release upload "$VIBE_VERSION" "${missing[@]}"
            fi
          else
            gh release create "$VIBE_VERSION" --draft --target "$GITHUB_SHA" \
              --title "VibeIDE $VIBE_VERSION" --notes-file RELEASE_NOTES.md "${files[@]}" "${extras[@]}" "${own_extras[@]}"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VIBE_VERSION: ${{ env.VIBE_VERSION }}
